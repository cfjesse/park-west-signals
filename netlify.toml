[build]
  command   = "npm run build"
  publish   = "dist/signals-study/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@libsql/linux-x64-gnu", "@libsql/client"]
  included_files = [
    "art-api/data/art.db",
    "art-api/schema.sql",
    "node_modules/@libsql/linux-x64-gnu/**"
  ]

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
