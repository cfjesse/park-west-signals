<div class="dialog-header-wrap">
  <div class="header-titles">
    <img class="dialog-artist-avatar" [src]="formData().avatar || artist.artist_avatar" alt="{{ artist.artist_name }}" />
    <div>
      <h2 mat-dialog-title class="dialog-title">Edit Artist Profile</h2>
      <p class="dialog-subtitle">Update artist name, avatar image URL, and biography</p>
    </div>
  </div>
  <button mat-icon-button (click)="dialogRef.close()" [disabled]="isSaving()" aria-label="Close dialog">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content mat-typography">
  @if (isSaving()) {
  <div class="dialog-loading-overlay">
    <mat-spinner diameter="44" strokeWidth="4"></mat-spinner>
    <div class="loading-text">
      <span class="loading-title">Updating Artist Profile</span>
      <span class="loading-sub">Saving changes to server...</span>
    </div>
  </div>
  }

  @if (updateError()) {
  <div class="alert-banner error-alert">
    <mat-icon>error</mat-icon>
    <span>{{ updateError() }}</span>
  </div>
  }

  <form class="edit-form" (submit)="$event.preventDefault(); saveEdit()">
    <div class="form-grid">
      <mat-form-field appearance="outline" class="form-field full-width">
        <mat-label>Artist Full Name</mat-label>
        <input matInput [value]="formData().name" (input)="updateField('name', $event)" [disabled]="isSaving()" placeholder="Artist Name" required />
        <mat-icon matPrefix>palette</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field full-width">
        <mat-label>Avatar Image URL</mat-label>
        <input matInput [value]="formData().avatar" (input)="updateField('avatar', $event)" [disabled]="isSaving()" placeholder="https://..." />
        <mat-icon matPrefix>image</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field full-width">
        <mat-label>Artist Biography / Statement</mat-label>
        <textarea matInput rows="3" [value]="formData().bio" (input)="updateField('bio', $event)" [disabled]="isSaving()" placeholder="Enter artist statement or bio..."></textarea>
        <mat-icon matPrefix>description</mat-icon>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button type="button" (click)="dialogRef.close()" [disabled]="isSaving()">
    Cancel
  </button>
  <button mat-flat-button color="primary" type="button" (click)="saveEdit()" [disabled]="isSaving()">
    @if (isSaving()) {
    <span class="btn-spinner-wrap">
      <mat-spinner diameter="18"></mat-spinner>
      <span>Saving...</span>
    </span>
    } @else {
    <span class="btn-spinner-wrap">
      <mat-icon>save</mat-icon>
      <span>Save Changes</span>
    </span>
    }
  </button>
</mat-dialog-actions>
