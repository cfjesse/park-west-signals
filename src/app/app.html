<header class="app-header">
  <mat-toolbar color="primary" class="main-toolbar">
    <a routerLink="/" class="brand-link">
      <mat-icon class="brand-icon">palette</mat-icon>
      <div class="brand-titles">
        <span class="brand-name">Park West Gallery</span>
        <span class="brand-portal">Customer Portal</span>
      </div>
    </a>
    <span class="spacer"></span>
    <nav class="nav-links">
      @for (item of menuItems; track item.routerLink) {
      <a mat-button [routerLink]="item.routerLink" class="nav-link">
        <span>{{ item.label }}</span>
      </a>
      }
    </nav>
  </mat-toolbar>
</header>

<main class="app-main">
  <router-outlet />
</main>
